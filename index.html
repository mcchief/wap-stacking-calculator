<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WoA Troop Stacking Calculator</title>

<style>
:root {
  --bg: #0b1220;
  --bg2: #0f172a;
  --panel: rgba(17, 24, 39, 0.96);
  --panel2: #1f2937;
  --text: #e5e7eb;
  --muted: #94a3b8;
  --accent: #22c55e;
  --border: #334155;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
}

body {
  font-family: Inter, Arial;
  margin: 0;
  background: linear-gradient(180deg, var(--bg), var(--bg2));
  color: var(--text);
}

.wrap {
  width: min(100%, 1400px);
  margin: auto;
  padding: 14px;
}

.hero {
  background: linear-gradient(135deg, #0f172a, #111827, #0b3b2e);
  padding: 20px;
  border-radius: 18px;
  border: 1px solid var(--border);
}

h1 { margin: 0 0 8px; }
.sub { color: var(--muted); }

/* 🔥 NEW IMAGE STYLING */
.stats-banner {
  width: 100%;
  margin: 18px 0 24px;
}

.stats-banner img {
  width: 100%;
  max-width: 1200px;
  display: block;
  margin: auto;
  border-radius: 14px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.35);
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: 320px 1fr;
  gap: 18px;
  margin-top: 18px;
}

.card {
  background: var(--panel);
  padding: 16px;
  border-radius: 16px;
  border: 1px solid var(--border);
}

input, select {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  background: #08111f;
  color: white;
  border: 1px solid var(--border);
}

button {
  padding: 10px 14px;
  border-radius: 10px;
  border: none;
  background: var(--accent);
  font-weight: bold;
  cursor: pointer;
}

.table-wrap {
  overflow-x: auto;
  margin-top: 10px;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  padding: 10px;
  border-bottom: 1px solid #253247;
}

th {
  background: #132033;
}

@media (max-width: 900px) {
  .grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="hero">
    <h1>WoA Troop Stacking Calculator</h1>
    <div class="sub">
      Enter Leadership, Authority, Dominance and build your optimal stack.
    </div>
  </div>

  <!-- ✅ IMAGE INSERTED HERE -->
  <div class="stats-banner">
    <img src="stats-banner.png" alt="Leadership Authority Dominance Guide">
  </div>

  <div class="grid">

    <div class="card">
      <h2>Inputs</h2>

      <label>Leadership</label>
      <input type="number" value="100000">

      <label>Authority</label>
      <input type="number" value="1000">

      <label>Dominance</label>
      <input type="number" value="1000">

      <br><br>

      <button>Calculate</button>
    </div>

    <div class="card">
      <h2>Output</h2>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Order</th>
              <th>Tier</th>
              <th>Name</th>
              <th>Type</th>
              <th>Count</th>
              <th>Total HP</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>1</td>
              <td>G7</td>
              <td>Sample Unit</td>
              <td>Ranged</td>
              <td>5000</td>
              <td>25,000,000</td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>

  </div>

</div>

</body>
</html>
